[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speculative-decoding-bench"
version = "0.1.0"
description = "DeepSpec-based speculative decoding benchmark for Qwen3-4B"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
